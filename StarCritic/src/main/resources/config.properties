# URL base de la API REST (StarCritic_Server). El hostname "starcritic-server"
# debe resolverse a la IP de la maquina del servidor (anhadir a /etc/hosts:
#   172.27.250.6   starcritic-server
# y actualizar esa entrada cuando el servidor se mueva a otra maquina).
API_BASE_URL=https://172.27.250.6:8443/api

# Truststore (PKCS12) con el certificado del servidor StarCritic_Server.
# Nombre del recurso en el classpath (carpeta src/main/resources), igual que
# este propio config.properties; se empaqueta dentro del JAR de la app.
TRUSTSTORE_PATH=truststore.p12
TRUSTSTORE_PASSWORD=changeit
